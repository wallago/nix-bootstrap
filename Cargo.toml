[package]
name = "nix-bootstrap"
version = "0.1.0"
edition = "2024"

[dependencies]
ratatui = "0.30.0"
clap = { version = "4.5.56", features = [
  "derive",
  "env",
  "wrap_help",
  "cargo",
] }
thiserror = "2.0.18"
color-eyre = "0.6.5"
serde = "1.0.228"
serde_derive = "1.0.228"
better-panic = "0.3.0"

[dev-dependencies]
pretty_assertions = "1.4.1"

[profile.dev]
opt-level = 0
debug = true
panic = "abort"

[profile.test]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
panic = "unwind"
lto = true
codegen-units = 1
strip = true

[profile.bench]
opt-level = 3
debug = false

